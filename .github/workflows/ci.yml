  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: node scripts/verify-project-context.mjs --base HEAD^1
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/stor24_crm
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-xss.mjs
      - name: Customer account mandate browser checks
        run: |
          npm run start -- --port 3041 > /tmp/stor24-tenant-ui.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3041/my > /dev/null; then break; fi
            sleep 1
          done
          TENANT_TEST_ORIGIN=http://localhost:3041 node scripts/tenant-portal-browser-check.mjs

