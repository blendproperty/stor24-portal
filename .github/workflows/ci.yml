name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guided-help:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:guides
      - run: node scripts/test-monthly-billing.mjs
      - run: node scripts/test-debit-orders.mjs
      - run: node scripts/test-adjustments.mjs
      - run: node scripts/test-collections.mjs
      - run: node scripts/test-settlements.mjs
      - run: node scripts/test-mri.mjs
      - run: node scripts/test-facial-photos.mjs
      - run: node scripts/test-identity.mjs
      - run: node scripts/test-premium-workspace.mjs
      - run: node scripts/test-tenant-login.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-help-browser-evidence
          path: |
            output/guided-help/
            output/monthly-billing/
            output/debit-orders/
            output/adjustments/
            output/collections/
            output/settlement/
            output/mri/1440.png
            output/mri/390.png
            output/facial-access/
            output/identity/
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/stor24_crm
      - run: npm run build

