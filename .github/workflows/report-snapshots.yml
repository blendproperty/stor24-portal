name: Generate scheduled report snapshots
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stor24-report-snapshots
  cancel-in-progress: false
jobs:
  reporting:
    if: vars.REPORT_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Generate due private snapshots and expire retained files
        env:
          REPORT_CRON_KEY: ${{ secrets.REPORT_CRON_KEY }}
        run: |
          test -n "$REPORT_CRON_KEY"
          curl --fail --silent --show-error --max-time 150 --connect-timeout 10 \
            --request POST --header "x-cron-key: $REPORT_CRON_KEY" \
            'https://portal.stor24.co.za/api/v1/reports/worker'
