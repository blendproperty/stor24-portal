name: Restricted runtime CRM workflows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restricted-runtime-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://stage_runtime:synthetic-runtime-only@localhost:5432/merchandise_ci
      MERCHANDISE_DB_TEST: isolated-ci
      TENANT_MERCHANDISE_CHECKOUT_ENABLED: 'true'
      AUTH_SECRET: synthetic-workload-auth-secret-at-least-32-characters
      INTEGRATION_CONFIG_ENCRYPTION_KEY: synthetic-workload-vault-key-at-least-32-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Create disposable separate migration and application roles
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          psql -h localhost -U ci -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE stage_migrator LOGIN PASSWORD 'synthetic-migrator-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS" -c "CREATE ROLE stage_runtime LOGIN PASSWORD 'synthetic-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS" -c 'CREATE DATABASE merchandise_ci OWNER stage_migrator'
      - name: Apply migrations using the isolated owner role
        env:
          DATABASE_URL: postgresql://stage_migrator:synthetic-migrator-only@localhost:5432/merchandise_ci
          ALLOW_EMPTY_DATABASE_BOOTSTRAP: 'true'
        run: node scripts/bootstrap-empty-database.mjs
      - name: Grant staging application access and exclude migration history
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          psql -h localhost -U ci -d merchandise_ci -v ON_ERROR_STOP=1 -c 'REVOKE CREATE ON SCHEMA public FROM PUBLIC' -c 'GRANT USAGE ON SCHEMA public TO stage_runtime' -c 'GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO stage_runtime' -c 'GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA public TO stage_runtime' -c 'REVOKE ALL ON TABLE "_prisma_migrations" FROM stage_runtime'
          role=$(PGPASSWORD=synthetic-runtime-only psql -h localhost -U stage_runtime -d merchandise_ci -At -c "SELECT rolsuper,rolbypassrls,rolcreatedb,rolcreaterole,rolreplication,has_schema_privilege(current_user,'public','CREATE') FROM pg_roles WHERE rolname=current_user")
          test "$role" = 'f|f|f|f|f|f'
          if PGPASSWORD=synthetic-runtime-only psql -h localhost -U stage_runtime -d merchandise_ci -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM "_prisma_migrations" LIMIT 1' >/dev/null 2>&1; then exit 1; fi
      - name: Exercise synthetic business and security workflows
        run: |
          for test in extended-security public-booking-origin staff-logout-revocation daily-close floor-availability unit-combination merchandise-transactions adjustments initial-rent monthly-billing posted-recurring-charge-report settlements reservation-move-in booking-contact-correction operational-forms; do
            npx tsx --test "tests/integration/${test}.test.ts"
          done
