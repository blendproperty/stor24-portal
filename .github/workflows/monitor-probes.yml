name: Monitor probe validation

on:
  pull_request:
    paths:
      - '.github/workflows/monitor-production.yml'
      - '.github/workflows/monitor-probes.yml'
      - 'scripts/*readiness*'
      - 'scripts/*heartbeat*'
      - 'scripts/external-monitor-worker.mjs'
      - 'wrangler.monitor.json'
      - 'tests/host-heartbeat.test.mjs'
      - 'tests/external-monitor-worker.test.mjs'
      - 'scripts/origin-access-health.sh'
      - 'tests/*readiness*'
      - 'tests/origin-access-health.test.mjs'

permissions:
  contents: read

jobs:
  probe-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test tests/origin-access-health.test.mjs tests/production-readiness.test.mjs tests/production-alert-details.test.mjs tests/host-heartbeat.test.mjs tests/external-monitor-worker.test.mjs
      - name: Verify actual external read-only probes from this network
        id: probe
        env:
          HEALTH_URL: https://portal.stor24.co.za/api/health
          EXPECT_MERCHANDISE_WORKER: 'true'
        run: node scripts/check-production-readiness.mjs
      - name: Resolve actual network evidence against an isolated primary-timeout fixture
        env:
          PRIMARY_FINDING: '{"state":"unverified","markers":["STOR24_ORIGIN_UNVERIFIED host=stor24.co.za probe=plain curl=28 attempts=3"]}'
          CONFIRMATION_FINDING: ${{ steps.probe.outputs.finding }}
        run: node scripts/check-production-readiness.mjs --resolve
