name: Monitor probe validation

on:
  pull_request:
    paths:
      - '.github/workflows/monitor-production.yml'
      - '.github/workflows/monitor-probes.yml'
      - 'scripts/*readiness*'
      - 'scripts/origin-access-health.sh'
      - 'tests/*readiness*'
      - 'tests/origin-access-health.test.mjs'

permissions:
  contents: read

jobs:
  probe-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/origin-access-health.test.mjs tests/production-readiness.test.mjs tests/production-alert-details.test.mjs
      - name: Verify actual external read-only probes from this network
        env:
          HEALTH_URL: https://portal.stor24.co.za/api/health
          EXPECT_MERCHANDISE_WORKER: 'true'
        run: node scripts/check-production-readiness.mjs
