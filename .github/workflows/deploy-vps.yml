name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: stor24-crm-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require exact main release evidence
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
        run: node scripts/verify-release.mjs
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/stor24_crm
          chmod 600 ~/.ssh/known_hosts ~/.ssh/stor24_crm

      - name: Deploy verified ref
        env:
          DEPLOY_REF: ${{ steps.release.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_USER"
          # Retry connection establishment only; never replay a partially executed deployment.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectionAttempts=3 -o ConnectTimeout=20 \
            -i ~/.ssh/stor24_crm "$VPS_USER@$VPS_HOST" \
            "set -o pipefail && umask 077 && cd /opt/stor24-crm && \
             git fetch origin '$DEPLOY_REF' && \
             git checkout --detach FETCH_HEAD && \
             if ! grep -q '^INTEGRATION_CONFIG_ENCRYPTION_KEY=' .env; then \
               umask 077; \
               integration_key=\$(openssl rand -hex 32); \
               printf 'INTEGRATION_CONFIG_ENCRYPTION_KEY=%s\n' \"\$integration_key\" >> .env; \
             fi && \
             if ! grep -q '^LEAD_SLA_WORKER_KEY=' .env; then \
               sla_key=\$(openssl rand -hex 32); \
               printf 'LEAD_SLA_WORKER_KEY=%s\n' \"\$sla_key\" >> .env; \
             fi && \
             /bin/bash scripts/dlp-backup.sh && \
             install -m 644 docs/stor24-dlp-backup.service docs/stor24-dlp-backup.timer /etc/systemd/system/ && \
             systemctl daemon-reload && systemctl enable --now stor24-dlp-backup.timer && \
             install -m 644 docs/stor24-operations-status.service docs/stor24-operations-status.timer /etc/systemd/system/ && \
             systemctl daemon-reload && systemctl enable --now stor24-operations-status.timer && \
             IMAGE_TAG=\$(git rev-parse --short HEAD) docker compose --env-file .env -f compose.prod.yml build app migrate && \
             IMAGE_TAG=\$(git rev-parse --short HEAD) docker compose --env-file .env -f compose.prod.yml run --rm migrate && \
             IMAGE_TAG=\$(git rev-parse --short HEAD) docker compose --env-file .env -f compose.prod.yml up -d --no-deps app && \
             container=\$(docker compose --env-file .env -f compose.prod.yml ps -q app) && \
             for attempt in \$(seq 1 40); do \
               state=\$(docker inspect --format '{{.State.Health.Status}}' \"\$container\"); \
               test \"\$state\" = healthy && break; \
               test \"\$state\" != unhealthy; \
               sleep 2; \
             done && \
             test \"\$(docker inspect --format '{{.State.Health.Status}}' \"\$container\")\" = healthy && \
             systemctl start stor24-operations-status.service && \
             install -m 644 docs/stor24-lead-sla.service docs/stor24-lead-sla.timer /etc/systemd/system/ && \
             systemctl daemon-reload && systemctl enable --now stor24-lead-sla.timer && \
             curl --fail http://127.0.0.1:3014/api/health"

