name: Release expired merchandise holds
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stor24-merchandise-expiry
  cancel-in-progress: false
jobs:
  expire:
    if: vars.MERCHANDISE_EXPIRY_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Release expired unpaid holds
        env:
          MERCHANDISE_CRON_KEY: ${{ secrets.MERCHANDISE_CRON_KEY }}
        run: |
          test -n "$MERCHANDISE_CRON_KEY"
          curl --fail --silent --show-error --max-time 120 --connect-timeout 10 \
            --request POST \
            --header "x-cron-key: $MERCHANDISE_CRON_KEY" \
            'https://stor24-site.srv938083.hstgr.cloud/api/v1/operations/merchandise-orders/expire'
