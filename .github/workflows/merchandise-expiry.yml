name: Release expired merchandise holds
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stor24-merchandise-expiry
  cancel-in-progress: false
jobs:
  expire:
    if: vars.MERCHANDISE_EXPIRY_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Release expired unpaid holds
        env:
          MERCHANDISE_CRON_KEY: ${{ secrets.MERCHANDISE_CRON_KEY }}
        run: |
          test -n "$MERCHANDISE_CRON_KEY"
          response="$(curl --fail --silent --show-error --max-time 40 --connect-timeout 10 --retry 2 --retry-delay 3 --retry-max-time 100 --retry-connrefused \
            --request POST \
            --header "x-cron-key: $MERCHANDISE_CRON_KEY" \
            'https://stor24-site.srv938083.hstgr.cloud/api/v1/operations/merchandise-orders/expire')"
          node -e '
            const result = JSON.parse(process.argv[1]);
            const count = result?.data?.expired;
            if (!Number.isInteger(count) || count < 0 || count > 100) {
              throw new Error("Unexpected merchandise expiry response");
            }
            console.log(`Expired unpaid orders released: ${count}`);
          ' "$response"
