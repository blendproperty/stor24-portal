name: Monitor production

on:
  # Cloudflare owns the ten-minute schedule; keep dispatch for the trigger and manual recovery.
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send labelled delivery tests to the configured operations recipients
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: stor24-production-monitor
  cancel-in-progress: false

jobs:
  readiness-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      state: ${{ steps.probe.outputs.state }}
      finding: ${{ steps.probe.outputs.finding }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe public health and direct-origin protection
        id: probe
        env:
          HEALTH_URL: https://portal.stor24.co.za/api/health
          EXPECT_MERCHANDISE_WORKER: ${{ vars.MERCHANDISE_EXPIRY_WORKER_ENABLED }}
        run: node scripts/check-production-readiness.mjs

  readiness-confirmation:
    needs: readiness-primary
    if: ${{ needs.readiness-primary.outputs.state == 'unverified' }}
    # Linux/Windows share Azure ranges; macOS uses GitHub's separate macOS cloud.
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      finding: ${{ steps.probe.outputs.finding }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently confirm public health and origin protection
        id: probe
        env:
          HEALTH_URL: https://portal.stor24.co.za/api/health
          EXPECT_MERCHANDISE_WORKER: ${{ vars.MERCHANDISE_EXPIRY_WORKER_ENABLED }}
        run: node scripts/check-production-readiness.mjs

  readiness:
    if: always()
    needs: [readiness-primary, readiness-confirmation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve verified readiness evidence
        env:
          PRIMARY_FINDING: ${{ needs.readiness-primary.outputs.finding }}
          CONFIRMATION_FINDING: ${{ needs.readiness-confirmation.outputs.finding }}
        run: node scripts/check-production-readiness.mjs --resolve

  backup:
    # Keep credentialed VPS connections off the repeatedly failing Azure egress path.
    runs-on: macos-latest
    timeout-minutes: 4
    environment: production
    steps:
      - name: Verify encrypted backup freshness
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/stor24_crm
          chmod 600 ~/.ssh/known_hosts ~/.ssh/stor24_crm
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -i ~/.ssh/stor24_crm "$VPS_USER@$VPS_HOST" '/bin/bash /opt/stor24-crm/scripts/dlp-backup-health.sh || { echo STOR24_BACKUP_FAILED; exit 1; }; /bin/bash /opt/stor24-crm/scripts/production-resource-health.sh || { echo STOR24_RESOURCES_FAILED; exit 1; }'

  alerts:
    if: always()
    needs: [readiness, backup]
    runs-on: macos-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked email transport
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Restore encrypted last-known recipients
        uses: actions/cache@v4
        with:
          path: .operations-alert-config.enc
          key: operations-alert-recipients-v1-${{ github.run_id }}
          restore-keys: operations-alert-recipients-v1-
      - name: Notify operations using existing STOR24 providers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STOR24_ALERT_CONFIG_KEY: ${{ secrets.STOR24_ALERT_CONFIG_KEY }}
          READINESS_RESULT: ${{ needs.readiness.result }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          ALERT_TEST: ${{ inputs.test_alert || false }}
          ALERT_EMAIL_TO: ${{ vars.STOR24_ALERT_EMAIL_TO }}
          ALERT_SMS_TO: ${{ vars.STOR24_ALERT_MOBILE }}
          ALERT_WHATSAPP_TO: ${{ vars.STOR24_ALERT_MOBILE }}
          ALERT_WHATSAPP_CONTENT_SID: ${{ vars.STOR24_ALERT_WHATSAPP_CONTENT_SID }}
          HOSTINGER_SMTP_PASSWORD: ${{ secrets.STOR24_ALERT_HOSTINGER_SMTP_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
        run: node scripts/send-production-alert.mjs
      - name: Publish aggregate dashboard evidence
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          READINESS_RESULT: ${{ needs.readiness.result }}
          BACKUP_RESULT: ${{ needs.backup.result }}
        run: |
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/stor24_crm
          chmod 600 ~/.ssh/known_hosts ~/.ssh/stor24_crm
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {safeMonitorEntry} from "./src/lib/operations-status-policy.mjs";
            let report = {}; try { report = JSON.parse(readFileSync("production-alert-result.json", "utf8")); } catch {}
            const entry = safeMonitorEntry({...report, checkedAt: new Date().toISOString(), runId: process.env.GITHUB_RUN_ID, readiness: process.env.READINESS_RESULT, backup: process.env.BACKUP_RESULT});
            if (!entry) throw new Error("Invalid dashboard evidence");
            process.stdout.write(JSON.stringify(entry));
          ' | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -i ~/.ssh/stor24_crm "$VPS_USER@$VPS_HOST" 'cd /opt/stor24-crm && node scripts/write-monitor-status.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-alert-result
          path: production-alert-result.json
          retention-days: 14
