name: Merchandise transaction checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_next_workload:
        description: Run one isolated synthetic Next HTTP workload pilot
        type: boolean
        default: false
      workload_source_sha:
        description: Exact reviewed 40-character source SHA (required for pilot)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: merchandise_ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/merchandise_ci
      MERCHANDISE_DB_TEST: isolated-ci
      TENANT_MERCHANDISE_CHECKOUT_ENABLED: 'true'
      ALLOW_EMPTY_DATABASE_BOOTSTRAP: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: node scripts/bootstrap-empty-database.mjs
      - run: npx tsx --test tests/integration/database-limits.test.ts
      - run: npx tsx --test tests/integration/database-capacity.test.ts
      - run: npx tsx --test tests/integration/security-boundaries.test.ts
      - run: npx tsx --test tests/integration/extended-security.test.ts
      - run: npx tsx --test tests/integration/unit-rate-adjustment.test.ts
      - run: npx tsx --test tests/integration/communication-log-search.test.ts
      - run: npx tsx --test tests/integration/request-rate-limit.test.ts
      - run: npx tsx --test tests/integration/dlp-transfer.test.ts
      - run: npx tsx --test tests/integration/mfa-recovery-atomicity.test.ts
      - run: npx tsx --test tests/integration/password-change-revocation.test.ts
      - run: npx tsx --test tests/integration/staff-logout-revocation.test.ts
      - run: npx tsx --test tests/integration/account-payment-retry.test.ts
      - run: npx tsx --test tests/integration/account-receipt.test.ts
      - run: npx tsx --test tests/integration/card-autopay.test.ts
      - run: npx tsx --test tests/integration/card-autopay-enrollment.test.ts
        env:
          AUTH_SECRET: synthetic-card-ci-auth-secret-at-least-32-characters
          INTEGRATION_CONFIG_ENCRYPTION_KEY: synthetic-card-ci-vault-key-at-least-32-characters
      - run: npx tsx --test tests/integration/netcash-payment-requests.test.ts
        env:
          AUTH_SECRET: synthetic-payment-request-ci-auth-secret-at-least-32
          INTEGRATION_CONFIG_ENCRYPTION_KEY: synthetic-payment-request-ci-vault-key-at-least-32
      - run: npx tsx --test tests/integration/netcash-debicheck-template.test.ts
      - run: npx tsx --test tests/integration/netcash-debicheck-requests.test.ts
      - run: npx tsx --test tests/integration/netcash-debicheck-attempt-journal.test.ts
      - run: npx tsx --test tests/integration/netcash-debicheck-bank-consent.test.ts
      - run: npx tsx --test tests/integration/netcash-debicheck-test-worker.test.ts
      - run: npx tsx --test tests/integration/posted-recurring-charge-report.test.ts
      - run: npx tsx --test tests/integration/visual-reporting.test.ts
      - run: npx tsx --test tests/integration/marketing-payment-cohorts.test.ts
      - run: npx tsx --test tests/integration/transfer-source-concurrency.test.ts
      - run: npx tsx --test tests/integration/daily-close.test.ts
      - run: npx tsx --test tests/integration/configuration-atomicity.test.ts
      - run: npx tsx --test tests/integration/operations-alerts.test.ts
      - run: npx tsx --test tests/integration/task-status-atomicity.test.ts
      - run: npx tsx --test tests/integration/staff-followups.test.ts
      - run: npx tsx --test tests/integration/staff-attention.test.ts
      - run: npx tsx --test tests/integration/staff-event-emails.test.ts
      - run: npx tsx --test tests/integration/stock-movement-atomicity.test.ts
      - run: npx tsx --test tests/integration/stock-request-replay.test.ts
      - run: npx tsx --test tests/integration/reserved-stock-guard.test.ts
      - run: npx tsx --test tests/integration/operations-create-atomicity.test.ts
      - run: npx tsx --test tests/integration/contact-change-security.test.ts
      - run: npx tsx --test tests/integration/billing-delivery.test.ts
      - run: npx tsx --test tests/integration/twilio-status-replay.test.ts
      - run: npx tsx --test tests/integration/whatsapp-delivery-claim.test.ts
      - run: npx tsx --test tests/integration/booking-message-claims.test.ts
      - run: npx tsx --test tests/integration/booking-contact-correction.test.ts
      - run: npx tsx --test tests/integration/public-verification-renewal.test.ts
      - run: npx tsx --test tests/integration/public-booking-origin.test.ts
      - run: npx tsx --test tests/integration/merchandise-transactions.test.ts
      - run: npx tsx --test tests/integration/uat-reset.test.ts
      - run: npx tsx --test tests/integration/move-in-training.test.ts
      - run: npx tsx --test tests/integration/training-debtor.test.ts
      - run: npx tsx --test tests/integration/booking-test-payment.test.ts
      - run: npx tsx --test tests/integration/reservation-move-in.test.ts
      - run: npx tsx --test tests/integration/customer-journey.test.ts
      - run: npx tsx --test tests/integration/walk-in.test.ts
      - run: npx tsx --test tests/integration/floor-availability.test.ts
      - run: npx tsx --test tests/integration/unit-combination.test.ts
      - run: npx tsx --test tests/integration/bulk-unit-pricing.test.ts
      - run: npx tsx --test tests/integration/operational-checklists.test.ts
      - run: npx tsx --test tests/integration/scheduled-work.test.ts
      - run: npx tsx --test tests/integration/faeez-workflow-permissions.test.ts
      - run: npx tsx --test tests/integration/micro-warehousing.test.ts
      - run: npx tsx --test tests/integration/facial-photos.test.ts
      - run: npx tsx --test tests/integration/identity-documents.test.ts
      - run: npx tsx --test tests/integration/recurring-charge-report.test.ts
      - run: npx tsx --test tests/integration/billing-plan-history-evidence.test.ts
      - run: npx tsx --test tests/integration/monthly-billing.test.ts
      - run: npx tsx --test tests/integration/initial-rent.test.ts
      - run: npx tsx --test tests/integration/rent-reviews.test.ts
      - run: npx tsx --test tests/integration/lead-sla.test.ts
      - run: npx tsx --test tests/integration/whatchimp-enquiry.test.ts
      - run: npx tsx --test tests/integration/debit-order-runs.test.ts
      - run: npx tsx --test tests/integration/debit-mandate-session.test.ts
      - run: npx tsx --test tests/integration/mandate-report-recovery.test.ts
      - run: npx tsx --test tests/integration/debit-order-initial-payment.test.ts
      - run: npx tsx --test tests/integration/public-recurring-payments.test.ts
      - run: npx tsx --test tests/integration/adjustments.test.ts
      - run: npx tsx --test tests/integration/netcash-refund.test.ts
      - run: npx tsx --test tests/integration/leads-workspace.test.ts
        env:
          LEADS_DB_TEST: isolated-ci
      - run: npx tsx --test tests/integration/marketing.test.ts
        env:
          MARKETING_DB_TEST: isolated-ci
      - run: npx tsx --test tests/integration/collections.test.ts
      - run: npx tsx --test tests/integration/customer-history.test.ts
      - name: Verify representative staff workload and limited offline source recovery
        run: npx tsx --test tests/integration/faeez-representative-workload.test.ts
      - run: npx tsx --test tests/integration/collection-schedules.test.ts
      - run: npx tsx --test tests/integration/collection-notices.test.ts
      - run: npx tsx --test tests/integration/operational-notices.test.ts
      - run: npx tsx --test tests/integration/operational-forms.test.ts
      - run: npx tsx --test tests/integration/collection-phone.test.ts
      - run: npx tsx --test tests/integration/settlements.test.ts
      - run: npx tsx --test tests/integration/unidentified-receipts.test.ts
      - run: npx tsx --test tests/integration/receipt-import-posting.test.ts
      - run: npx tsx --test tests/integration/receipt-reallocation.test.ts
      - run: npx tsx --test tests/integration/receipt-reallocation-workflow.test.ts tests/integration/receipt-correction-training.test.ts
      - run: npx tsx --test tests/integration/reservation-price-amendments.test.ts
      - run: npx tsx --test tests/integration/mri.test.ts
      - run: npx tsx --test tests/integration/mri-mapping.test.ts
      - run: npx tsx --test tests/integration/mri-sandbox.test.ts
      - run: npx tsx --test tests/integration/mri-sandbox-maintenance.test.ts
      - run: npx tsx --test tests/integration/mri-batch.test.ts
      - name: Verify synthetic database backup and restore
        run: npx tsx scripts/test-synthetic-restore.ts
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-restore-evidence
          path: output/recovery/synthetic-restore.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: readiness-capacity-evidence
          path: output/readiness/
          if-no-files-found: error

  next-workload-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_next_workload == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REVIEWED_SOURCE_SHA: ${{ inputs.workload_source_sha }}
      WORKFLOW_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Require exact reviewed dispatch source
        shell: bash
        run: |
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEWED_SOURCE_SHA" == "$WORKFLOW_SOURCE_SHA" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.workload_source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: One isolated synthetic HTTP workload
        env:
          STOR24_NEXT_WORKLOAD_EXECUTION: approved-isolated
        run: node scripts/test-next-representative-workload.mjs --run --source "$REVIEWED_SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-next-workload-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/next-workload/*/manifest.json
            output/next-workload/*/http-result.json
            output/next-workload/*/database-result.json
            output/next-workload/*/build-*.log
