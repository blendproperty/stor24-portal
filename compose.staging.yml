name: stor24-readiness-staging
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stor24_staging
      POSTGRES_USER: stor24_stage
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?A separate staging password is required}
    volumes:
      - staging-db:/var/lib/postgresql/data
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    logging: &staging-logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U stor24_stage -d stor24_staging"]
      interval: 5s
      retries: 12
    networks: [isolated]
  bootstrap:
    image: stor24-crm-migrate:${IMAGE_TAG:?A validated image revision is required}
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://stor24_stage:${STAGING_DB_PASSWORD}@postgres:5432/stor24_staging
      ALLOW_EMPTY_DATABASE_BOOTSTRAP: 'true'
    command: [node, scripts/bootstrap-empty-database.mjs]
    volumes:
      - ./scripts/bootstrap-empty-database.mjs:/app/scripts/bootstrap-empty-database.mjs:ro
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    logging: *staging-logs
    networks: [isolated]
  app:
    image: stor24-crm:${IMAGE_TAG:?A validated image revision is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://stor24_stage:${STAGING_DB_PASSWORD}@postgres:5432/stor24_staging
      AUTH_SECRET: ${STAGING_AUTH_SECRET:?A separate staging signing secret is required}
      APP_URL: http://127.0.0.1:3000
      TENANT_PORTAL_ORGANISATION_SLUG: synthetic-staging
      EMAIL_PROVIDER: disabled
      WHATSAPP_AUTOMATION_ENABLED: 'false'
      TENANT_MERCHANDISE_CHECKOUT_ENABLED: 'false'
      PUBLIC_PAYMENT_SIMULATOR_ENABLED: 'false'
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    logging: *staging-logs
    healthcheck:
      test: [CMD, wget, '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [isolated]
networks:
  isolated:
    internal: true
volumes:
  staging-db:
