<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071411" />
    <title>Offline | STOR 24 Operations</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 82% 16%,rgba(255,90,10,.2),transparent 30%),#f5f3ea;color:#071411;font-family:Arial,sans-serif}.card{width:min(720px,100%);padding:clamp(34px,7vw,68px);border:1px solid rgba(7,20,17,.14);border-radius:28px;background:rgba(255,255,255,.92);box-shadow:0 28px 80px rgba(7,20,17,.12)}img{width:180px;height:auto;margin-bottom:42px}.eyebrow{margin:0;color:#d94f00;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:14px 0 20px;font-size:clamp(50px,9vw,86px);line-height:.9;letter-spacing:-.055em}p{max-width:590px;margin:0;color:#53615c;font-size:18px;line-height:1.6}.notice{margin-top:26px;padding:16px;border-left:4px solid #ff5a0a;border-radius:10px;background:#fff4ed;color:#71300c;font-size:14px;font-weight:700;line-height:1.5}button{margin-top:28px;min-height:48px;padding:0 22px;border:0;border-radius:999px;background:#ff5a0a;color:#fff;font:800 14px Arial,sans-serif;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/brand/stor24-logo-dark.svg" alt="STOR 24" />
      <p class="eyebrow">Safe offline shell</p>
      <h1>You&apos;re offline.</h1>
      <p>The secure STOR 24 operations system needs a live connection. Reconnect to sign in and work with current facility information.</p>
      <div class="notice">No customer data, payments, documents, biometrics or staff actions are stored or queued on this device.</div>
      <button type="button" onclick="location.replace('/')">Try again</button>
    </main>
    <script>addEventListener("online",()=>location.replace("/"))</script>
  </body>
</html>
