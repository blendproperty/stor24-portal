services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: stor24-crm-migrate:${IMAGE_TAG:-latest}
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["tools"]
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: production
    networks:
      - stor24-crm

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stor24-crm:${IMAGE_TAG:-latest}
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    logging: *bounded-logs
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: production
      TENANT_PORTAL_ORGANISATION_SLUG: ${TENANT_PORTAL_ORGANISATION_SLUG:-stor24}
      DLP_BACKUP_STATUS_PATH: /app/dlp-backup-status
    volumes:
      - /opt/backups/stor24-dlp/status:/app/dlp-backup-status:ro
    ports:
      - "127.0.0.1:${APP_PORT:-3014}:3000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.stor24-crm.rule=Host(`${APP_HOST:-portal.stor24.co.za}`)
      - traefik.http.routers.stor24-crm.entrypoints=websecure
      - traefik.http.routers.stor24-crm.tls=true
      - traefik.http.routers.stor24-crm.tls.certresolver=mytlschallenge
      - traefik.http.services.stor24-crm.loadbalancer.server.port=3000
      # Preserve API/webhook delivery on the previous hostname during migration.
      - traefik.http.routers.stor24-crm-legacy.rule=Host(`stor24-site.srv938083.hstgr.cloud`)
      - traefik.http.routers.stor24-crm-legacy.entrypoints=websecure
      - traefik.http.routers.stor24-crm-legacy.tls=true
      - traefik.http.routers.stor24-crm-legacy.tls.certresolver=mytlschallenge
      - traefik.http.routers.stor24-crm-legacy.service=stor24-crm
      - traefik.http.routers.stor24-crm-navigation.rule=Host(`stor24-site.srv938083.hstgr.cloud`) && (Method(`GET`) || Method(`HEAD`)) && !PathPrefix(`/api/`)
      - traefik.http.routers.stor24-crm-navigation.entrypoints=websecure
      - traefik.http.routers.stor24-crm-navigation.tls=true
      - traefik.http.routers.stor24-crm-navigation.tls.certresolver=mytlschallenge
      - traefik.http.routers.stor24-crm-navigation.service=stor24-crm
      - traefik.http.routers.stor24-crm-navigation.priority=100
      - traefik.http.routers.stor24-crm-navigation.middlewares=stor24-portal-domain
      - traefik.http.middlewares.stor24-portal-domain.redirectregex.regex=^https://stor24-site[.]srv938083[.]hstgr[.]cloud/(.*)
      - traefik.http.middlewares.stor24-portal-domain.redirectregex.replacement=https://portal.stor24.co.za/$${1}
      - traefik.http.middlewares.stor24-portal-domain.redirectregex.permanent=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stor24-crm
      - traefik

  postgres:
    image: postgres:17-alpine
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    logging: *bounded-logs
    restart: unless-stopped
    profiles: ["database"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stor24_crm}
      POSTGRES_USER: ${POSTGRES_USER:-stor24}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - stor24-crm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stor24} -d ${POSTGRES_DB:-stor24_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      stor24-crm:
        aliases:
          - stor24-postgres

networks:
  stor24-crm:
    name: stor24-crm
  traefik:
    external: true
    name: root_default

volumes:
  stor24-crm-postgres:
    name: stor24-crm-postgres
