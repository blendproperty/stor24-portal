services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: stor24-crm-migrate:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: production
    networks:
      - stor24-crm

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stor24-crm:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: production
      TENANT_PORTAL_ORGANISATION_SLUG: ${TENANT_PORTAL_ORGANISATION_SLUG:-stor24}
    ports:
      - "127.0.0.1:${APP_PORT:-3014}:3000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.stor24-crm.rule=Host(`${APP_HOST:-stor24-site.srv938083.hstgr.cloud}`)
      - traefik.http.routers.stor24-crm.entrypoints=websecure
      - traefik.http.routers.stor24-crm.tls=true
      - traefik.http.routers.stor24-crm.tls.certresolver=mytlschallenge
      - traefik.http.services.stor24-crm.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stor24-crm
      - traefik

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    profiles: ["database"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stor24_crm}
      POSTGRES_USER: ${POSTGRES_USER:-stor24}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - stor24-crm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stor24} -d ${POSTGRES_DB:-stor24_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      stor24-crm:
        aliases:
          - stor24-postgres

networks:
  stor24-crm:
    name: stor24-crm
  traefik:
    external: true
    name: root_default

volumes:
  stor24-crm-postgres:
    name: stor24-crm-postgres
